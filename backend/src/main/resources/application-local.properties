server.port=8080

spring.datasource.url=jdbc:h2:mem:hotelcheck;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Hotel Site Check — developer machine only (REQ-038). Run with --spring.profiles.active=local.
hotelcheck.sitecheck.enabled=true
# PageSpeed Insights key for the Google-signal checks (a later requirement); unset means those checks report UNKNOWN.
hotelcheck.sitecheck.psi-key=${HOTELCHECK_SITECHECK_PSI_KEY:}
